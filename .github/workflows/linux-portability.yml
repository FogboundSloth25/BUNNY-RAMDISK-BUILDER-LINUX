name: Linux portability and APFS build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro: [ubuntu:latest, debian:stable-slim, fedora:latest, archlinux:latest]
    container:
      image: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v4
      - name: Install shell tooling
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update && apt-get install -y bash coreutils findutils
          elif command -v dnf >/dev/null; then
            dnf install -y bash coreutils findutils
          elif command -v pacman >/dev/null; then
            pacman -Sy --noconfirm bash coreutils findutils
          fi
      - name: Bash syntax
        run: |
          bash -n env.sh
          bash -n setup_dependencies.sh
          bash -n build.sh
          bash -n boot.sh
          bash -n ssh.sh
          bash -n status.sh
          bash -n scripts/ramdisk_linux.sh
          bash -n scripts/build_apfs_module.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .

  apfs-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel module build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev dwarves rsync git linux-headers-$(uname -r)
      - name: Build linux-apfs-rw with shared builder
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/linux-apfs-rw-src"
          out="$RUNNER_TEMP/apfs.ko"
          git clone --depth 1 https://github.com/linux-apfs/linux-apfs-rw.git "$src"
          ./scripts/build_apfs_module.sh "$src" "$out"
          test -s "$out"
          modinfo "$out" >/dev/null
          file "$out"
          sha256sum "$out"

  userspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-pip
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install --upgrade pip
          .ci-venv/bin/pip install -r requirements.txt
          .ci-venv/bin/python -c 'import capstone, pyimg4, usb; print("Python dependencies OK")'
