name: Linux portability and APFS build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro: [ubuntu:latest, debian:stable-slim, fedora:latest, archlinux:latest]
    container:
      image: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v4
      - name: Install shell tooling
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update && apt-get install -y bash coreutils findutils python3
          elif command -v dnf >/dev/null; then
            dnf install -y bash coreutils findutils python3
          elif command -v pacman >/dev/null; then
            pacman -Sy --noconfirm bash coreutils findutils python
          fi
      - name: Bash syntax
        run: |
          bash -n env.sh
          bash -n setup_dependencies.sh
          bash -n build.sh
          bash -n boot.sh
          bash -n ssh.sh
          bash -n status.sh
          bash -n scripts/ramdisk_linux.sh
          bash -n scripts/build_apfs_module.sh
          bash -n scripts/make_logo.sh
          python3 -m py_compile scripts/finalize_iboot.py

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck -S error -x \
            env.sh setup_dependencies.sh build.sh boot.sh ssh.sh status.sh \
            scripts/ramdisk_linux.sh scripts/build_apfs_module.sh scripts/make_logo.sh

  apfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install APFS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev dwarves rsync git linux-headers-generic
      - name: Build linux-apfs-rw
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/linux-apfs-rw-src"
          out="$RUNNER_TEMP/apfs.ko"
          KDIR="$(find -L /lib/modules -mindepth 2 -maxdepth 2 -name build | head -1)"
          test -d "$KDIR"
          git clone --depth 1 https://github.com/linux-apfs/linux-apfs-rw.git "$src"
          KDIR="$KDIR" bash ./scripts/build_apfs_module.sh "$src" "$out"
          test -s "$out"
          modinfo "$out" >/dev/null
      - name: Build mkapfs
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/apfsprogs"
          stage="$RUNNER_TEMP/apfsprogs-build"
          git clone --depth 1 https://github.com/linux-apfs/apfsprogs.git "$src"
          rm -rf "$stage"
          mkdir -p "$stage"
          rsync -a "$src/" "$stage/"
          commit="$(git -C "$src" describe --always HEAD | tail -c 9)"
          printf '#define GIT_COMMIT\t"%s"\n' "$commit" > "$stage/mkapfs/version.h"
          make -C "$stage/mkapfs" -j"$(nproc)"
          test -x "$stage/mkapfs/mkapfs"
          version="$($stage/mkapfs/mkapfs -v)"
          test "$version" = "mkapfs $commit"

  userspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-pip
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install --upgrade pip
          .ci-venv/bin/pip install -r requirements.txt
          .ci-venv/bin/python -c 'import capstone, pyimg4, usb; print("Python dependencies OK")'

  img4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install IMG4 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev
      - name: Build img4lib
        run: |
          set -euo pipefail
          git clone --recursive --depth 1 https://github.com/xerub/img4lib.git "$RUNNER_TEMP/img4lib"
          make -C "$RUNNER_TEMP/img4lib/lzfse" -j"$(nproc)"
          make -C "$RUNNER_TEMP/img4lib" -j"$(nproc)"
          test -x "$RUNNER_TEMP/img4lib/img4"
          "$RUNNER_TEMP/img4lib/img4" -h >/tmp/img4-help
          grep -q -- '-P' /tmp/img4-help
      - name: Validate kernel patch generator
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/kerneldiff.py
          printf '\x00\x01\x02\x03' > /tmp/original.bin
          printf '\x00\xff\x02\xfe' > /tmp/patched.bin
          python3 scripts/kerneldiff.py /tmp/original.bin /tmp/patched.bin /tmp/test.bpatch
          grep -q '^#AMFI' /tmp/test.bpatch
          grep -q '^0x1 0x01 0xff$' /tmp/test.bpatch
          grep -q '^0x3 0x03 0xfe$' /tmp/test.bpatch
